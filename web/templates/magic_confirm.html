{{define "content"}}
<div class="auth-wrapper">
  <div class="has-text-centered mb-5">
    <h1 class="logo">disjoint<span>_</span></h1>
  </div>

  <div class="box">
    {{if .Valid}}
      <h2 class="title is-5 mb-3">Sign in as @{{.Username}}?</h2>
      <p class="is-size-7 muted mb-4">
        This one-time link expires {{formatTime .ExpiresAt}}.
      </p>
      <form method="POST" action="/auth/magic">
        <input type="hidden" name="token" value="{{.Token}}">
        <button type="submit" class="button is-primary is-fullwidth">Sign In</button>
      </form>
    {{else}}
      <h2 class="title is-5 mb-3">Login link invalid or expired</h2>
      <p class="muted mb-4">
        This link cannot be used. Ask an admin for a new one-time login link.
      </p>
      <a href="/login" class="button is-secondary is-fullwidth">Back to sign in</a>
    {{end}}
  </div>
</div>
{{end}}
