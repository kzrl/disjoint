{{define "content"}}
<div class="auth-wrapper">
  <div class="has-text-centered mb-5">
    <h1 class="logo">disjoint<span>_</span></h1>
    <p class="has-text-grey">Create your account</p>
  </div>

  <div class="box">
    <form method="POST" action="/register">
      <input type="hidden" name="code" value="{{.Code}}">
      <div class="field">
        <label for="username" class="label">Username</label>
        <div class="control">
          <input type="text" id="username" name="username" class="input" minlength="3" maxlength="32" required autofocus autocomplete="username">
        </div>
        <p class="help">At least 3 characters.</p>
      </div>
      <div class="field">
        <label for="password" class="label">Password</label>
        <div class="control">
          <input type="password" id="password" name="password" class="input" minlength="6" required autocomplete="new-password">
        </div>
        <p class="help">At least 6 characters.</p>
      </div>
      <button type="submit" class="button is-primary is-fullwidth mt-2">Create Account</button>
    </form>
  </div>

  <div class="has-text-centered is-size-7 has-text-grey">
    Already have an account? <a href="/login">Sign in here</a>
  </div>
</div>
{{end}}
