{{define "content"}}
<div class="auth-wrapper">
  <div class="has-text-centered mb-5">
    <h1 class="logo">disjoint<span>_</span></h1>
    <p class="muted">Sign in to your account</p>
  </div>

  {{if .Disabled}}
  <p class="notification is-warning is-size-7">Your account has been disabled. Contact an administrator.</p>
  {{end}}

  <div class="box">
    <form method="POST" action="/login">
      <div class="field">
        <label for="username" class="label">Username</label>
        <div class="control">
          <input type="text" id="username" name="username" class="input" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label for="password" class="label">Password</label>
        <div class="control">
          <input type="password" id="password" name="password" class="input" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="button is-primary is-fullwidth mt-2">Sign In</button>
    </form>

    <div class="has-text-centered my-4"><span class="is-size-7 muted">or</span></div>
    <button type="button" class="button is-secondary is-fullwidth" id="passkey-login-btn" hidden>
      Sign in with a passkey
    </button>
    <p class="is-size-7 mt-2" id="passkey-login-status" role="status" aria-live="polite" hidden></p>
  </div>

  <div class="has-text-centered is-size-7 muted">
    Don't have an account? <a href="/register">Register here</a>
  </div>
</div>
{{end}}

{{define "scripts"}}<script src="/static/passkeys.js?v=2"></script>{{end}}
