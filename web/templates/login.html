{{define "content"}}
<div class="auth-wrapper">
  <div class="has-text-centered mb-5">
    <h1 class="logo">disjoint<span>_</span></h1>
    <p class="has-text-grey">Sign in to your account</p>
  </div>

  <div class="box">
    <form method="POST" action="/login">
      <div class="field">
        <label for="username" class="label">Username</label>
        <div class="control">
          <input type="text" id="username" name="username" class="input" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label for="password" class="label">Password</label>
        <div class="control">
          <input type="password" id="password" name="password" class="input" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="button is-primary is-fullwidth mt-2">Sign In</button>
    </form>
  </div>

  <div class="has-text-centered is-size-7 has-text-grey">
    Don't have an account? <a href="/register">Register here</a>
  </div>
</div>
{{end}}
