{{define "content"}}
<div class="auth-wrapper">
  <div class="auth-header">
    <h1>disjoint<span>_</span></h1>
    <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Sign in to your account</p>
  </div>

  <div class="form-panel">
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-input" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In</button>
    </form>
  </div>

  <div style="text-align: center; font-size: 13px; color: var(--text-dim);">
    Don't have an account? <a href="/register">Register here</a>
  </div>
</div>
{{end}}
