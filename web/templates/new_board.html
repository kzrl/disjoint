{{define "content"}}
<div>
  <nav class="breadcrumb is-small mb-4" aria-label="breadcrumbs">
    <ul>
      <li><a href="/">Home</a></li>
      <li class="is-current" aria-current="page"><span>Create Board or Category</span></li>
    </ul>
  </nav>

  <div class="columns is-4">
    <!-- Create Board Form -->
    <div class="column">
      <div class="box">
        <h2 class="title is-4 mb-4">Create a New Board</h2>
        <form method="POST" action="/boards/new">
          <div class="field">
            <label for="category_id" class="label">Category</label>
            <div class="control">
              <div class="select is-fullwidth">
                <select id="category_id" name="category_id" required>
                  {{range .Categories}}
                    <option value="{{.ID}}">{{.Name}}</option>
                  {{end}}
                </select>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="board_name" class="label">Board Name</label>
            <div class="control">
              <input type="text" id="board_name" name="name" class="input" placeholder="e.g. Technology & Code" required>
            </div>
          </div>

          <div class="field">
            <label for="board_description" class="label">Description (optional)</label>
            <div class="control">
              <input type="text" id="board_description" name="description" class="input" placeholder="e.g. Discussions about software and projects">
            </div>
          </div>

          <button type="submit" class="button is-primary">Create Board</button>
        </form>
      </div>
    </div>

    <!-- Create Category Form -->
    <div class="column">
      <div class="box">
        <h2 class="title is-4 mb-4">Create a New Category</h2>
        <form method="POST" action="/categories/new">
          <div class="field">
            <label for="cat_name" class="label">Category Name</label>
            <div class="control">
              <input type="text" id="cat_name" name="name" class="input" placeholder="e.g. Projects & Gaming" required>
            </div>
          </div>

          <div class="field">
            <label for="cat_position" class="label">Position / Order</label>
            <div class="control">
              <input type="number" id="cat_position" name="position" class="input" value="10" min="0">
            </div>
          </div>

          <button type="submit" class="button is-light">Create Category</button>
        </form>
      </div>
    </div>
  </div>
</div>
{{end}}
