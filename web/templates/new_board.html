{{define "content"}}
<div>
  <nav class="breadcrumb my-4" aria-label="breadcrumbs">
    <ul>
      <li><a href="/">Home</a></li>
      <li class="is-active" aria-current="page"><a>Create Board</a></li>
    </ul>
  </nav>

  <div class="columns is-4">
    <div class="column">
      <div class="box">
        <h2 class="title is-4 mb-4">Create a New Board</h2>
        <form method="POST" action="/boards/new">
          <div class="field">
            <label for="board_name" class="label">Board Name</label>
            <div class="control">
              <input type="text" id="board_name" name="name" class="input" placeholder="e.g. Technology & Code" required>
            </div>
          </div>

          <div class="field">
            <label for="board_description" class="label">Description (optional)</label>
            <div class="control">
              <input type="text" id="board_description" name="description" class="input" placeholder="e.g. Discussions about software and projects">
            </div>
          </div>

          <button type="submit" class="button is-primary">Create Board</button>
        </form>
      </div>
    </div>
  </div>
</div>
{{end}}
