{{define "content"}}
<div class="auth-wrapper">
  <div class="auth-header">
    <h1 class="logo">welcome to disjoint<span>_</span></h1>
    <p class="has-text-grey">First-run configuration &bull; Create administrator</p>
  </div>

  <div class="box">
    <p class="has-text-grey mb-4">
      Welcome to your new Disjoint instance! No users exist yet. Please create your primary administrator account to get started.
    </p>

    <form method="POST" action="/setup">
      <div class="field">
        <label for="username" class="label">Administrator Username</label>
        <div class="control">
          <input type="text" id="username" name="username" class="input" minlength="3" maxlength="32" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label for="password" class="label">Administrator Password</label>
        <div class="control">
          <input type="password" id="password" name="password" class="input" minlength="6" required autocomplete="new-password">
        </div>
        <p class="help">At least 6 characters.</p>
      </div>
      <button type="submit" class="button is-primary is-fullwidth mt-2">Complete Setup</button>
    </form>
  </div>
</div>
{{end}}
