{{define "content"}}
<div class="auth-wrapper">
  <div class="auth-header">
    <h1>welcome to disjoint<span>_</span></h1>
    <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">First-run configuration &bull; Create administrator</p>
  </div>

  <div class="form-panel">
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
      Welcome to your new Disjoint instance! No users exist yet. Please create your primary administrator account to get started.
    </p>

    <form method="POST" action="/setup">
      <div class="form-group">
        <label for="username" class="form-label">Administrator Username</label>
        <input type="text" id="username" name="username" class="form-input" minlength="3" maxlength="32" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Administrator Password</label>
        <input type="password" id="password" name="password" class="form-input" minlength="6" required autocomplete="new-password">
        <div class="form-hint">At least 6 characters.</div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Complete Setup</button>
    </form>
  </div>
</div>
{{end}}
