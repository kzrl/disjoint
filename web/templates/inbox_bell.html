{{define "inbox_bell"}}
<!-- Navbar bell. Its own poll (GET /inbox/count) swaps this element whole, so
     the hx-get/hx-trigger attributes must live on the anchor itself — an
     outerHTML swap of a child would drop them and stop the polling. Polling
     is paused while the tab is hidden; the filter is re-evaluated on every
     tick, so it resumes when the tab comes back. -->
<a href="/inbox" class="navbar-item inbox-link"
   title="Mentions and replies"
   aria-label="Inbox{{if .UnreadNotifications}}, {{.UnreadNotifications}} unread{{end}}"
   hx-get="/inbox/count" hx-trigger="every 60s [!document.hidden]" hx-swap="outerHTML">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
  {{if .UnreadNotifications}}
    <span class="inbox-badge" aria-hidden="true">{{if gt .UnreadNotifications 99}}99+{{else}}{{.UnreadNotifications}}{{end}}</span>
  {{end}}
</a>
{{end}}
