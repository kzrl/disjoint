{{define "content"}}
<div class="auth-wrapper">
  <div class="auth-header">
    <h1>disjoint<span>_</span></h1>
    <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Invite-only community</p>
  </div>

  <div class="form-panel" style="text-align: center; padding: 32px 24px;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <p style="color: var(--text-muted); font-size: 14px; line-height: 1.6; margin: 0;">
      This forum is invite-only.<br>
      Ask an administrator for an invite link to join.
    </p>
  </div>

  <div style="text-align: center; font-size: 13px; color: var(--text-dim);">
    Already have an account? <a href="/login">Sign in here</a>
  </div>
</div>
{{end}}
