services:
  disjoint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disjoint
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/disjoint.db
      - UPLOAD_DIR=/data/uploads
    volumes:
      - disjoint_data:/data

volumes:
  disjoint_data:
